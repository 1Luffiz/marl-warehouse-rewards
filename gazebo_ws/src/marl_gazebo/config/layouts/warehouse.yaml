name: warehouse
size: [10.0, 8.0]            # x: от -5 до 5, y: от -4 до 4
max_steps: 400               # 40 с на эпизод
min_goal_separation: 1.2     # заказы не ставятся на соседние станции

circles: []

# Прямоугольные препятствия: [cx, cy, ширина по x, глубина по y, тип]
rects:
  - [-4.70,  0.40, 0.60, 5.20, rack]       # стеллаж у левой стены
  - [-2.90,  0.40, 0.60, 5.20, rack]       # двусторонний стеллаж 1
  - [-1.10,  0.40, 0.60, 5.20, rack]       # двусторонний стеллаж 2
  - [ 1.40,  1.20, 2.20, 0.50, rack]       # короткий стеллаж (центр, верх)
  - [ 1.40, -1.20, 2.20, 0.50, rack]       # короткий стеллаж (центр, низ)
  - [ 4.65, -2.40, 0.70, 0.90, workstation]  # рабочее место с манипулятором 1
  - [ 4.65,  0.00, 0.70, 0.90, workstation]  # рабочее место с манипулятором 2
  - [ 4.65,  2.40, 0.70, 0.90, workstation]  # рабочее место с манипулятором 3
  - [ 1.60,  3.65, 3.60, 0.50, conveyor]   # стол упаковки / конвейер
  - [ 1.40, -3.20, 0.80, 0.80, pallet]     # паллета с коробками
  - [ 3.20, -3.40, 0.80, 0.80, pallet]
  - [-4.40, -3.40, 0.80, 0.80, pallet]

# Станции комплектации [x, y]
stations:
  - [-3.80, -1.20]    # проход 1
  - [-3.80,  0.60]
  - [-3.80,  2.30]
  - [-2.00, -1.40]    # проход 2
  - [-2.00,  0.40]
  - [-2.00,  2.20]
  - [-0.35, -1.60]    # у стеллажа 2 со стороны центра
  - [-0.35,  2.40]
  - [ 1.00,  0.45]    # между центральными стеллажами
  - [ 2.00, -0.45]
  - [ 1.40, -2.00]    # под центральным стеллажом
  - [ 3.80, -2.40]    # у рабочих мест с манипуляторами
  - [ 3.80,  0.00]
  - [ 3.80,  2.40]
  - [ 0.40,  2.90]    # у стола упаковки
  - [ 2.60,  2.90]
